apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: default 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: journal-api
      containers:
      - name: journal-api
        image: IMAGE_PLACEHOLDER
        envFrom:
        - secretRef:
            name: journal-secret
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-sync"
      ports:
        - containerPort: 8000
      resources:
        limits:
          memory: "512Mi"
          cpu: "500m"
        requests:
          memory: "256Mi"
          cpu: "250m"
      livenessProbe:
        httpGet:
          path: /health
          port: 8000