apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: default 
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: journal-api
      containers:
      - name: journal-api
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: journal-secret
        env:
        - name: OTEL_SERVICE_NAME
          value: "journal-api"
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-sync"