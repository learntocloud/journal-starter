apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: journal-api
  namespace: monitoring
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: journal-api

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /metrics/
      interval: 15s