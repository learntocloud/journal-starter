apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-sync
spec:
  provider: azure
  secretObjects:                              # This creates the K8s Secret
  - secretName: journal-secret
    type: Opaque
    data:
    - objectName: postgrespassword            # Links to the object down below
      key: POSTGRES_PASSWORD                   # Env var name in K8s
    - objectName: OpenAiApiKey                # FIXED: Added to map OpenAI key
      key: OPENAI_API_KEY                     # Env var name in K8s (customizable)
    - objectName: databaseurl                 # FIXED: Added to map DB URL
      key: DATABASE_URL                       # Env var name in K8s (customizable)
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "b7a2d306-e1ce-4f02-889a-f33b5aaa43c5"
    keyvaultName: "journalkv"
    objects: |
      array:
        - |
          objectName: postgrespassword
          objectType: secret
        - |
          objectName: OpenAiApiKey
          objectType: secret
        - |
          objectName: databaseurl
          objectType: secret
    tenantId: "d1977dc2-66b5-4d78-ba80-11aa9bc03829"