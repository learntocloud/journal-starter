name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build_and_publish_docker_image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EKS
    needs: build_and_publish_docker_image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1
          
      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name journal-api-eks-cluster

      - name: Test Kubernetes authentication
        run: |
          kubectl get nodes
          kubectl auth can-i get pods --all-namespaces

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Substitute image and apply Kubernetes manifests
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/journal-api \
            --timeout=180s