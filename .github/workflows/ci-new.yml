name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: career_journal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Initialize database schema
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: psql -h localhost -U postgres -d career_journal -f database_setup.sql
      
      - name: Run tests
        env:
        
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://models.github.ai/inference
          GITHUB_MODEL: openai/gpt-4o
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/career_journal
        run: pytest


  build:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: learntocloud.azurecr.io
      ACR_USERNAME: learntocloud
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t ${{ env.ACR_REGISTRY }}/journal-starter-app:${{ github.sha }} .
      
      - name: Login to Azure Container Registry
        run: docker login -u ${{ env.ACR_USERNAME }} -p ${{ env.ACR_PASSWORD }} ${{ env.ACR_REGISTRY }}
      
      - name: Push image to ACR
        run: docker push ${{ env.ACR_REGISTRY }}/journal-starter-app:${{ github.sha }}