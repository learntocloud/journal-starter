name: CI

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: career_journal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Initialize database schema
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: psql -h localhost -U postgres -d career_journal -f database_setup.sql
      
      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://models.github.ai/inference
          GITHUB_MODEL: openai/gpt-4o
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/career_journal
        run: uv run pytest


  build:
    name: Build and Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: journalapicontainerregistry.azurecr.io
      ACR_USERNAME: learntocloud
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t ${{ env.ACR_REGISTRY }}/journal-starter-app:${{ github.sha }} .
      
      - name: Login to Azure Container Registry
        run: echo ${{ env.ACR_PASSWORD }} | docker login -u ${{ env.ACR_USERNAME }} --password-stdin ${{ env.ACR_REGISTRY }}
      
      - name: Push image to ACR
        run: docker push ${{ env.ACR_REGISTRY }}/journal-starter-app:${{ github.sha }}
   

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: journalapicontainerregistry.azurecr.io
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Hop 1: Authenticate GitHub Actions to Azure via OIDC
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Connect to your specific AKS cluster
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'learntocloud' # <-- Update this
          cluster-name: 'learntocloud'      # <-- Update this

      # Substitute the placeholder with the newly built image tag
      - name: Substitute Image Placeholder
        run: |
          FULL_IMAGE_NAME="${{ env.ACR_REGISTRY }}/journal-starter-app:${{ github.sha }}"
          sed -i "s|IMAGE_PLACEHOLDER|$FULL_IMAGE_NAME|g" k8s/deployment.yaml
          
          # Print output to logs to verify successful replacement
          cat k8s/deployment.yaml | grep "image:"

      # Apply the updated configurations to the cluster
      - name: Deploy Manifests to K8s
        run: |
          kubectl apply -f k8s/
  