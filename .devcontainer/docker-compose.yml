services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:3-3.14-bookworm
    # The app reads the mounted .env directly instead of a container-environment snapshot.
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    env_file: ["../.env"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database_setup.sql:/docker-entrypoint-initdb.d/database_setup.sql
      - ../database_setup_test.sql:/docker-entrypoint-initdb.d/database_setup_test.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: